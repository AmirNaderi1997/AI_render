services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - job_data:/data/jobs:ro
      - ./certs:/etc/nginx/tls:ro
    depends_on:
      app:
        condition: service_healthy
      hermes:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100

  frontend:
    build:
      context: ./web
      target: build
    volumes:
      - frontend_dist:/usr/share/nginx/html
    entrypoint: ["sh", "-c", "cp -r /app/dist/. /usr/share/nginx/html/ && echo 'Frontend deployed'"]
    restart: "no"
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://airender:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/airender
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=${APP_ENV:-development}
      - JOBS_DIR=/app/job_data
    volumes:
      - job_data:/app/job_data
      # The Library API writes uploaded media and its index into this folder.
      - ./assets:/app/assets
      # The My Effects API persists rules, favorites, and the selected Rafiei
      # style in presets/my_effects.yaml. Keep this mount writable for the API.
      - ./presets:/app/presets
      - ./samples:/app/samples:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512

  celery-worker:
    build: .
    command: >
      celery -A app.celery_app.celery worker
      --concurrency=2
      --loglevel=info
      -Q default
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://airender:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/airender
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=${APP_ENV:-development}
      - JOBS_DIR=/app/job_data
    volumes:
      - job_data:/app/job_data
      - ./assets:/app/assets:ro
      - ./presets:/app/presets:ro
      - ./samples:/app/samples:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    mem_limit: 6g
    cpus: 2.0
    pids_limit: 512

  celery-beat:
    build: .
    command: >
      celery -A app.celery_app.celery beat
      --pidfile=/tmp/celerybeat.pid
      --loglevel=info
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100

  hermes:
    build: .
    command: >
      gunicorn hermes.main:app
      -w 2
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8001
      --timeout 120
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://airender:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/airender
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=${APP_ENV:-development}
    volumes:
      - job_data:/app/job_data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airender
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airender"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100

volumes:
  pg_data:
  redis_data:
  job_data:
  frontend_dist:

networks:
  default:
    name: airender-net
