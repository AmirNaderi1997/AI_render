# Rafiei Reel Style — caption look, render defaults, and AI brain tuning.
# Colours are #RRGGBB (alpha optional as #RRGGBBAA, 00 = opaque).
name: Rafiei Reel Style
captions:
  fonts_dir: presets/fonts
  base:
    font: Arial
    size: 78
    bold: true
    colour: "#FFFFFF"
    outline_colour: "#000000"
    outline: 6
    shadow: 0
    margin_bottom: 520
    margin_sides: 60
  styles:
    normal: {}
    emphasis:
      colour: "#FFD700"
      size: 92
    cta:
      colour: "#00FF66"
      size: 84
  # Stage 2: caption generation rules
  min_words: 2
  max_words: 5
render:
  crf: 20
  preset: medium
  audio_bitrate: 192k
  preview_scale: 0.5
  loudness_lufs: -14
music:
  fade_out: 0.8
  default_volume_db: -14
  duck_volume_db: -24
zoom:
  punch_frames: 6
  min_zoom: 1.0
  max_zoom: 1.20
  punch_in_zoom: 1.15
  slow_zoom_from: 1.0
  slow_zoom_to: 1.08
# Stage 2: AI brain parameters
silence:
  min_pause_sec: 0.4
  padding_sec: 0.08
  noise_db: -35
editing:
  max_static_sec: 4.0
  punch_in_speed: 1.15
  slow_zoom_chance: 0.6
broll:
  default_duration_sec: 2.0
  min_gap_sec: 8.0
sfx:
  whoosh_on_broll: true
  whoosh_volume_db: -3
