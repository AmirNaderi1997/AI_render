add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

location = /healthz {
    access_log off;
    proxy_pass http://app_backend/health;
    proxy_set_header X-Request-ID $correlation_id;
}

location ^~ /media/hermes/ {
    alias /data/jobs/hermes/media/;
    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;
    expires 1h;
}

location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
}

location ~ /\. { deny all; }

location /api/hermes/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://hermes_backend/api/hermes/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Request-ID $correlation_id;
    proxy_read_timeout 120;
    proxy_send_timeout 120;
    client_max_body_size 100m;
}

location /api/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://app_backend/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Request-ID $correlation_id;
}

location = /api/health/ready {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://app_backend/api/health/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Request-ID $correlation_id;
}

location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://app_backend/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Request-ID $correlation_id;
    proxy_read_timeout 600;
    proxy_send_timeout 600;
    client_max_body_size 500m;
}

location /data/jobs/ {
    internal;
    alias /data/jobs/;
}
