worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    map $http_x_request_id $correlation_id {
        default $http_x_request_id;
        "" $request_id;
    }
    map $uri $safe_log_path {
        default $uri;
        ~*(?:@|%40) "[REDACTED]";
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe_json escape=json '{"time":"$time_iso8601","request_id":"$correlation_id","method":"$request_method","path":"$safe_log_path","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /var/log/nginx/access.log safe_json;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    # Docker's embedded DNS can return a new address when a service container
    # is recreated. Keep the result fresh without restarting nginx.
    upstream app_backend {
        zone app_backend 64k;
        server app:8000 resolve;
    }
    upstream hermes_backend {
        zone hermes_backend 64k;
        server hermes:8001 resolve;
    }
    resolver 127.0.0.11 valid=5s ipv6=off;

    # The container entrypoint creates this file from the HTTP or TLS template.
    include /etc/nginx/conf.d/site.conf;
}
